<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRANIX QA Result Collector</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">CRX</span>
    <div>
      <h1 data-i18n="appTitle">CRANIX QA Result Collector</h1>
      <p class="sub" id="planMeta">Loading test plan…</p>
    </div>
  </div>
  <div class="topbar-actions">
    <select id="langSelect" class="select" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
    <button id="importBtn" class="btn" data-i18n="import">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <div class="export-group">
      <button class="btn" data-export="md" data-i18n="exportMd">Report (MD)</button>
      <button class="btn" data-export="json" data-i18n="exportJson">JSON</button>
      <button class="btn" data-export="csv" data-i18n="exportCsv">CSV</button>
    </div>
    <span id="userBox" class="user-box" hidden></span>
    <button id="logoutBtn" class="btn" data-i18n="logout" hidden>Logout</button>
  </div>
</header>

<div id="loginOverlay" class="login-overlay" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <span class="logo big">CRX</span>
    <h2 data-i18n="loginTitle">Sign in</h2>
    <p class="muted small" data-i18n="loginSubtitle">Use your CRANIX account.</p>
    <label class="field-label" for="loginUser" data-i18n="username">Username</label>
    <input id="loginUser" class="input" autocomplete="username" required>
    <label class="field-label" for="loginPass" data-i18n="password">Password</label>
    <input id="loginPass" class="input" type="password" autocomplete="current-password" required>
    <p id="loginError" class="login-error" hidden></p>
    <button id="loginSubmit" class="btn primary wide" type="submit" data-i18n="login">Sign in</button>
  </form>
</div>

<div class="app">
  <aside class="sidebar">
    <section id="runPanel" class="panel"></section>
    <section id="progressPanel" class="panel"></section>
    <section id="filterPanel" class="panel"></section>
  </aside>
  <main id="content" class="content">
    <section id="envPanel"></section>
    <section id="casesPanel"></section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="static/app.js" defer></script>
</body>
</html>
